<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>客戶別績效</title>
<style>
  :root{
    --navy:#1B3A5C; --navy-2:#264A6E; --gold:#C9932E; --gold-soft:#F3E6C8;
    --bg:#F4F5F7; --card:#FFFFFF; --line:#E4E7EB; --text:#22262B; --sub:#6B7078;
    --green:#2E7D4F; --green-bg:#E5F3EA; --red:#B42E2E; --red-bg:#FBEAEA;
    --amber:#8A6D00; --amber-bg:#FFF2B2;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans CJK TC","Microsoft JhengHei",Helvetica,Arial,sans-serif;
    -webkit-tap-highlight-color:transparent;}
  .wrap{max-width:560px;margin:0 auto;padding-bottom:40px;}

  header{position:sticky;top:0;z-index:20;background:var(--navy);color:#fff;padding:14px 16px 0 16px;}
  header h1{font-size:18px;margin:2px 0 2px 0;font-weight:700;}
  header .period{font-size:11.5px;opacity:.75;padding-bottom:10px;}

  .navtabs{display:flex;background:#12283F;padding:0 10px;gap:4px;}
  .navtab{flex:1;text-align:center;padding:11px 4px;font-size:14px;font-weight:700;
    color:rgba(255,255,255,.55);cursor:pointer;border-bottom:3px solid transparent;user-select:none;}
  .navtab.active{color:#fff;border-bottom:3px solid var(--gold);}

  .subtabs-label{font-size:10.5px;color:var(--sub);font-weight:600;padding:8px 14px 0 14px;background:var(--bg);}
  .tabs{display:flex;background:var(--bg);padding:6px 14px 10px 14px;gap:6px;border-bottom:1px solid var(--line);}
  .tab{flex:1;text-align:center;padding:8px 4px;font-size:12.5px;font-weight:600;
    color:var(--sub);background:var(--card);border:1px solid var(--line);border-radius:8px;
    cursor:pointer;user-select:none;}
  .tab.active{color:#fff;background:var(--navy);border-color:var(--navy);font-weight:700;}
  .tabs-cat{padding-top:0;padding-bottom:10px;}
  .tabs-cat .tab{font-size:12px;padding:6px 4px;background:var(--bg);border:1px solid var(--line);color:var(--sub);}
  .tabs-cat .tab.active{background:var(--gold);border-color:var(--gold);color:#fff;}

  .searchbar{padding:10px 14px;background:var(--navy-2);}
  .searchbar input{width:100%;padding:9px 12px;border-radius:9px;border:none;
    font-size:14.5px;background:rgba(255,255,255,.92);color:var(--text);}
  .searchbar input::placeholder{color:#8a8f96;}

  .summary{display:flex;gap:8px;padding:12px 14px 4px 14px;}
  .sumcard{flex:1;background:var(--card);border-radius:10px;padding:10px 12px;
    box-shadow:0 1px 2px rgba(20,30,45,.06);}
  .sumcard .lbl{font-size:11px;color:var(--sub);margin-bottom:3px;}
  .sumcard .val{font-size:15px;font-weight:700;color:var(--navy);}
  .sumcard .sub{font-size:10.5px;color:var(--sub);margin-top:2px;}

  .note{font-size:11px;color:var(--sub);padding:6px 16px 10px 16px;line-height:1.5;}

  .custgroup{margin:10px 12px;background:var(--card);border-radius:12px;
    box-shadow:0 1px 3px rgba(20,30,45,.07);overflow:hidden;}
  .custheadmain{display:flex;align-items:center;justify-content:space-between;
    padding:13px 14px;cursor:pointer;user-select:none;gap:8px;}
  .custheadmain .left{min-width:0;flex:1;}
  .custheadmain .name{font-size:15px;font-weight:700;color:var(--navy);
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .custheadmain .repbadge{display:inline-block;margin-top:3px;font-size:10.5px;font-weight:600;
    color:var(--sub);background:var(--bg);border-radius:20px;padding:2px 8px;}
  .custheadmain .right{display:flex;align-items:center;gap:8px;flex:none;}
  .custheadmain .amtwrap{text-align:right;}
  .custheadmain .amtline{display:flex;align-items:center;justify-content:flex-end;gap:6px;}
  .custheadmain .amt{font-size:14.5px;font-weight:700;color:var(--navy);font-variant-numeric:tabular-nums;}
  .custheadmain .rate{font-size:10.5px;margin-top:2px;}
  .chev{width:9px;height:9px;border-right:2px solid var(--sub);border-bottom:2px solid var(--sub);
    transform:rotate(45deg);transition:transform .18s;flex:none;}
  .custgroup.open > .custheadmain .chev{transform:rotate(-135deg);}

  .custbodywrap{display:none;border-top:1px solid var(--line);}
  .custgroup.open .custbodywrap{display:block;}

  .catsection{border-bottom:6px solid var(--bg);}
  .catsection:last-child{border-bottom:none;}
  .catlabel{padding:9px 14px;font-size:12px;font-weight:700;color:var(--navy);
    background:var(--gold-soft);letter-spacing:.5px;}

  .cmp{display:flex;gap:8px;padding:12px 14px;background:var(--bg);}
  .cmpcard{flex:1;background:var(--card);border-radius:9px;padding:9px 10px;box-shadow:0 1px 2px rgba(20,30,45,.05);}
  .cmpcard .l{font-size:10.5px;color:var(--sub);margin-bottom:2px;}
  .cmpcard .v{font-size:14px;font-weight:700;color:var(--navy);font-variant-numeric:tabular-nums;}

  .cmptable{padding:12px 14px;background:var(--bg);}
  .cmptable table{width:100%;border-collapse:collapse;font-size:12px;}
  .cmptable th{text-align:right;color:var(--sub);font-weight:600;font-size:10.5px;padding-bottom:4px;}
  .cmptable th:first-child{text-align:left;}
  .cmptable td{text-align:right;padding:4px 0;font-variant-numeric:tabular-nums;}
  .cmptable td:first-child{text-align:left;color:var(--sub);font-weight:600;}

  .mrow{display:flex;align-items:center;justify-content:space-between;
    padding:11px 14px 11px 18px;cursor:pointer;user-select:none;border-bottom:1px solid var(--line);}
  .custlist .mrow:last-child{border-bottom:none;}
  .mrow .m{display:flex;align-items:center;gap:6px;font-size:13.5px;font-weight:600;color:var(--text);flex:1;min-width:0;}
  .mrow .mright{display:flex;flex-direction:column;align-items:flex-end;gap:3px;flex:none;}
  .mrow .mrightline{display:flex;align-items:center;gap:8px;}
  .mchev{width:8px;height:8px;border-right:1.8px solid var(--sub);border-bottom:1.8px solid var(--sub);
    transform:rotate(45deg);transition:transform .18s;flex:none;}
  .mrow.open .mchev{transform:rotate(-135deg);}
  .mrow .v{font-size:13.5px;font-weight:700;color:var(--navy);font-variant-numeric:tabular-nums;}

  .chg{font-size:11px;font-weight:700;border-radius:6px;padding:1px 6px;flex:none;}
  .chg.up{color:var(--green);background:var(--green-bg);}
  .chg.down{color:var(--red);background:var(--red-bg);}
  .chg.flat{color:var(--sub);background:var(--bg);}

  .ratepill{font-size:10.5px;font-weight:700;border-radius:6px;padding:1px 6px;flex:none;}
  .ratepill.high{color:var(--green);background:var(--green-bg);}
  .ratepill.mid{color:var(--amber);background:var(--amber-bg);}
  .ratepill.low{color:var(--red);background:var(--red-bg);}
  .ratepill.new{color:var(--navy);background:var(--gold-soft);}

  .monthdetail{display:none;border-top:1px solid var(--line);background:var(--bg);}
  .mrow.open + .monthdetail{display:block;}
  .mdrow{display:flex;align-items:center;justify-content:space-between;
    padding:9px 14px 9px 30px;border-bottom:1px solid var(--line);gap:8px;}
  .mdrow:last-child{border-bottom:none;}
  .mdname{font-size:12.5px;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0;}
  .mdright{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex:none;}
  .mdrightline{display:flex;align-items:center;gap:6px;}
  .mdval{font-size:12.5px;font-weight:700;color:var(--navy);font-variant-numeric:tabular-nums;}
  .mdempty{padding:10px 14px 10px 30px;font-size:12px;color:var(--sub);}

  .wrow{display:flex;align-items:center;justify-content:space-between;
    padding:9px 14px 9px 30px;cursor:pointer;user-select:none;border-bottom:1px solid var(--line);
    background:#EFF3F7;}
  .wrow .m{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:var(--navy-2);flex:1;min-width:0;}
  .wrow .mright{display:flex;flex-direction:column;align-items:flex-end;gap:3px;flex:none;}
  .wrow .v{font-size:12.5px;font-weight:700;color:var(--navy);font-variant-numeric:tabular-nums;}
  .wchev{width:7px;height:7px;border-right:1.6px solid var(--sub);border-bottom:1.6px solid var(--sub);
    transform:rotate(45deg);transition:transform .18s;flex:none;}
  .wrow.open .wchev{transform:rotate(-135deg);}
  .weekdetail{display:none;background:var(--bg);}
  .wrow.open + .weekdetail{display:block;}
  .weekdetail .mdrow{padding-left:44px;}
  .weekdetail .mdempty{padding-left:44px;}

  .ccy{font-size:0.68em;font-weight:600;color:var(--sub);background:var(--bg);
    border-radius:5px;padding:1px 4px;margin-left:2px;vertical-align:1px;}

  .homecard{margin:12px 12px;background:var(--card);border-radius:12px;padding:14px 16px;
    box-shadow:0 1px 3px rgba(20,30,45,.07);}
  .homecard h2{font-size:14.5px;color:var(--navy);margin:0 0 10px 0;}
  .homecard .hint{font-size:11px;color:var(--sub);margin-top:8px;line-height:1.5;}
  .gobtn{display:block;text-align:center;margin-top:10px;background:var(--navy);color:#fff;
    font-size:13.5px;font-weight:700;padding:11px;border-radius:9px;cursor:pointer;user-select:none;}
  .gobtn .tag{display:inline-block;border:1.5px solid rgba(255,255,255,.8);border-radius:6px;
    padding:1px 8px;margin-right:4px;}

  .statrow{display:flex;align-items:center;justify-content:space-between;
    padding:9px 0;border-bottom:1px solid var(--line);}
  .statrow:last-child{border-bottom:none;}
  .statrow .l{font-size:13px;color:var(--sub);font-weight:600;}
  .statrow .r{text-align:right;}
  .statrow .r .v{font-size:15px;font-weight:700;color:var(--navy);font-variant-numeric:tabular-nums;}
  .statrow .r .s{font-size:10.5px;color:var(--sub);margin-top:1px;}

  .empty{padding:40px 20px;text-align:center;color:var(--sub);font-size:13px;}
  .footer{padding:16px;text-align:center;color:var(--sub);font-size:10.5px;}

  .page{display:none;}
  .page.active{display:block;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="pagetitle">客戶別績效</h1>
    <div class="period" id="pageperiod">內銷 2026年1月-9/14｜外銷 2026年1月-9/9</div>
  </header>
  <div class="navtabs" id="navtabs">
    <div class="navtab" data-page="home">首頁</div>
    <div class="navtab" data-page="domestic">內銷</div>
    <div class="navtab" data-page="export">外銷</div>
  </div>

  <div id="page-home" class="page">
    <div class="homecard">
      <h2 id="homeDomTitle">內銷累積</h2>
      <div id="homeDomCard"></div>
    </div>
    <div class="homecard">
      <h2 id="homeExpTitle">外銷累積</h2>
      <div id="homeExpCard"></div>
      <div class="hint">銷售額、利潤換算為台幣（TWD）僅供本頁概覽比較用；外銷分頁內仍以原始交易幣別（USD／JPY）呈現。出貨量為所有品項數量加總，不分計量單位，僅供概略參考。</div>
    </div>
    <div class="homecard">
      <h2>快速前往</h2>
      <div class="gobtn" onclick="gotoPage('domestic')"><span class="tag">內銷</span>客戶明細（出貨量／銷售額／利潤）</div>
      <div class="gobtn" onclick="gotoPage('export')"><span class="tag">外銷</span>客戶明細（出貨量／銷售額／利潤）</div>
    </div>
    <div class="footer">製表日期：2026-09-14</div>
  </div>

  <div id="page-domestic" class="page">
    <div class="subtabs-label">選擇指標</div>
    <div class="tabs" id="tabs-dom">
      <div class="tab" data-metric="qty">出貨量</div>
      <div class="tab" data-metric="amt">銷售額</div>
      <div class="tab" data-metric="profit">利潤</div>
    </div>
    <div class="searchbar"><input id="search-dom" type="text" placeholder="搜尋客戶或品項名稱…" autocomplete="off"></div>
    <div class="summary" id="summary-dom"></div>
    <div class="note" id="note-dom"></div>
    <div id="content-dom"></div>
    <div class="footer">製表日期：2026-09-14</div>
  </div>

  <div id="page-export" class="page">
    <div class="subtabs-label">選擇指標</div>
    <div class="tabs" id="tabs-exp">
      <div class="tab" data-metric="qty">出貨量</div>
      <div class="tab" data-metric="amt">銷售額</div>
      <div class="tab" data-metric="profit">利潤</div>
    </div>
    <div class="subtabs-label">品項分類</div>
    <div class="tabs tabs-cat" id="cattabs-exp">
      <div class="tab" data-cat="all">全部</div>
      <div class="tab" data-cat="漁獲">漁獲</div>
      <div class="tab" data-cat="油">油</div>
    </div>
    <div class="searchbar"><input id="search-exp" type="text" placeholder="搜尋客戶或品項名稱…" autocomplete="off"></div>
    <div class="summary" id="summary-exp"></div>
    <div class="note" id="note-exp"></div>
    <div id="content-exp"></div>
    <div class="footer">製表日期：2026-09-14</div>
  </div>

</div>

/* ---------- shared helpers ---------- */
function fmtQty(n){
  if (n === null || n === undefined) return '0';
  const r = Math.round(n*10)/10;
  return Number.isInteger(r) ? r.toLocaleString('en-US') : r.toLocaleString('en-US',{maximumFractionDigits:1});
}
function fmtMoney(n){
  if (n === null || n === undefined) return '0';
  return Math.round(n).toLocaleString('en-US');
}
function ccySpan(ccy){ return '<span class="ccy">'+ccy+'</span>'; }
function fmtMoneyCcy(n, ccy){ return fmtMoney(n) + ' ' + ccySpan(ccy||'TWD'); }
function pctStr(cur, prev){
  if (prev === null || prev === undefined) return {txt:'—', cls:'flat'};
  if (prev === 0){ return cur > 0 ? {txt:'+100%', cls:'up'} : {txt:'—', cls:'flat'}; }
  const p = (cur - prev) / Math.abs(prev) * 100;
  const cls = p > 0.05 ? 'up' : (p < -0.05 ? 'down' : 'flat');
  const sign = p >= 0 ? '+' : '';
  return {txt: sign + p.toFixed(0) + '%', cls};
}
function rateInfo(rate){
  if (typeof rate === 'string') return {txt: rate, cls:'new'};
  if (rate === null || rate === undefined) return {txt:'—', cls:'new'};
  const pct = rate*100;
  const cls = pct >= 80 ? 'high' : (pct >= 40 ? 'mid' : 'low');
  return {txt: pct.toFixed(0)+'%', cls};
}
function rateOf(cur, prev){
  if (!prev) return cur>0 ? '2026年新增' : null;
  return cur/prev;
}

/* ---------- page navigation ---------- */
let currentPage = 'home';
function gotoPage(p){
  currentPage = p;
  document.querySelectorAll('.navtab').forEach(t=>t.classList.toggle('active', t.dataset.page===p));
  document.querySelectorAll('.page').forEach(el=>el.classList.remove('active'));
  document.getElementById('page-'+p).classList.add('active');
  const titles = {home:'客戶別績效', domestic:'內銷客戶別績效', export:'外銷客戶別績效'};
  const periods = {home:`內銷 ${DOM.periodLabel}｜外銷 ${EXP.periodLabel}`, domestic:DOM.periodLabel, export:EXP.periodLabel};
  document.getElementById('pagetitle').textContent = titles[p];
  document.getElementById('pageperiod').textContent = periods[p];
  window.scrollTo(0,0);
}
document.getElementById('navtabs').addEventListener('click', (e)=>{
  const t = e.target.closest('.navtab');
  if (!t) return;
  gotoPage(t.dataset.page);
});

  const cap = metric.charAt(0).toUpperCase()+metric.slice(1);

  if (kind==='total2025') return 'total'+cap+'2025';
  if (kind==='rate') return 'rate'+cap;

    const rows = months.map((m,i)=>{
      const prev = i>0 ? c[mKeyMonthly][i-1] : null;
      const chg = i>0 ? pctStr(c[mKeyMonthly][i], prev) : {txt:'—', cls:'flat'};
      let mdHtml;
      if (i===lastIdx && c.weeks && c.weeks.length){
        mdHtml = c.weeks.map(w=>{
          const wCur = w[metric];
          const wPrev = w['prev'+metric.charAt(0).toUpperCase()+metric.slice(1)];
          const wChg = pctStr(wCur, wPrev);
          const wProducts = w.products.filter(p=>p[metric]).sort((a,b)=>b[metric]-a[metric]);
          const wProdHtml = wProducts.length
            ? wProducts.map(p=>{
                const pPrev = p['prev'+metric.charAt(0).toUpperCase()+metric.slice(1)];
                const pChg = pctStr(p[metric], pPrev);
                return `<div class="mdrow"><div class="mdname">${p.product}</div><div class="mdright"><div class="mdrightline"><div class="mdval">${meta.fmt(p[metric])}</div><div class="chg ${pChg.cls}">${pChg.txt}</div></div></div></div>`;
              }).join('')
            : '<div class="mdempty">本週無出貨品項</div>';
          return `<div class="wrow" onclick="toggleMonth(this)"><div class="m"><div class="wchev"></div>${w.label}</div><div class="mright"><div class="mrightline"><div class="v">${meta.fmt(wCur)}</div><div class="chg ${wChg.cls}">${wChg.txt}</div></div></div></div>
            <div class="weekdetail">${wProdHtml}</div>`;
        }).join('');
      } else {
        const monthProducts = c.products.filter(p=>p[mKeyMonthly][i]).sort((a,b)=>b[mKeyMonthly][i]-a[mKeyMonthly][i]);
        mdHtml = monthProducts.length
          ? monthProducts.map(p=>{
              const pPrev = i>0 ? p[mKeyMonthly][i-1] : null;
              const pChg = i>0 ? pctStr(p[mKeyMonthly][i], pPrev) : {txt:'—', cls:'flat'};
              return `<div class="mdrow"><div class="mdname">${p.product}</div><div class="mdright"><div class="mdrightline"><div class="mdval">${meta.fmt(p[mKeyMonthly][i])}</div><div class="chg ${pChg.cls}">${pChg.txt}</div></div></div></div>`;
            }).join('')
          : '<div class="mdempty">本月無出貨品項</div>';
      }
      return `<div class="mrow" onclick="toggleMonth(this)"><div class="m"><div class="mchev"></div>${m}</div><div class="mright"><div class="mrightline"><div class="v">${meta.fmt(c[mKeyMonthly][i])}</div><div class="chg ${chg.cls}">${chg.txt}</div></div></div></div>
        <div class="monthdetail">${mdHtml}</div>`;
    }).join('');

    return `
      <div class="custgroup${searchDom ? ' open':''}" data-idx="${ci}">
        <div class="custheadmain" onclick="toggleCust(this)">
          <div class="left">
            <div class="name">${c.customer}</div>
            <div class="repbadge">業務：${repTxt}</div>
          </div>
          <div class="right">
            <div class="amtwrap">
              <div class="amtline"><div class="amt">${meta.fmt(c[mKeyTotal])}</div></div>
              <div class="rate ratepill ${cRate.cls}">${cRate.txt}</div>
            </div>
            <div class="chev"></div>
          </div>
        </div>
        <div class="custbodywrap">
          <div class="cmp">
            <div class="cmpcard"><div class="l">${DOM.periodLabel}</div><div class="v">${meta.fmt(c[mKeyTotal])}</div></div>
            <div class="cmpcard"><div class="l">2025年全年</div><div class="v">${meta.fmt(c[mKeyTotal2025])}</div></div>
          </div>
          <div class="custlist">${rows}</div>
        </div>
      </div>`;
  }).join('');
}

/* ---------- EXPORT (multi-currency for amt) ---------- */
let searchExp = '';
let metricExp = 'amt';
let catFilterExp = 'all';
const META_EXP = {
  qty:    { label:'出貨量', unitNote:'依「發貨數量」加總（不分計價幣別）', rateBase:'出貨量' },
  amt:    { label:'銷售額', unitNote:'依原始交易幣別分開加總，不轉換', rateBase:'銷售額' },
  profit: { label:'利潤',   unitNote:'＝銷售額－成本，因成本僅台幣計算，故利潤統一以TWD呈現', rateBase:'利潤' },
};
function renderExpSummary(){
  let g;
  if (catFilterExp === 'all'){
    g = EXP.grand;
  } else {
    let qty=0, amtTWD=0, profit=0, cust=0;
    EXP.customers.forEach(c=>{
      const block = c.categories[catFilterExp];
      if (!block) return;
      qty += block.totalQty; amtTWD += block.sortAmtTWD; profit += block.totalProfit; cust += 1;
    });
    g = {totalQty:qty, totalAmtTWD:amtTWD, totalProfit:profit, custCount:cust};
  }
  const margin = g.totalAmtTWD ? (g.totalProfit/g.totalAmtTWD*100).toFixed(1) : '0';
  document.getElementById('summary-exp').innerHTML = `
    <div class="sumcard"><div class="lbl">出貨量(26年)</div><div class="val">${fmtQty(g.totalQty)}</div></div>
    <div class="sumcard"><div class="lbl">銷售額(26年)</div><div class="val">${fmtMoneyCcy(g.totalAmtTWD,'TWD換算')}</div></div>
    <div class="sumcard"><div class="lbl">利潤(26年)</div><div class="val">${fmtMoneyCcy(g.totalProfit,'TWD')}</div><div class="sub">毛利率 ${margin}%</div></div>
  `;
  const catLabel = catFilterExp==='all' ? '全部品項' : catFilterExp;
  document.getElementById('note-exp').textContent =
    `目前分頁：${META_EXP[metricExp].label}（${META_EXP[metricExp].unitNote}）｜品項分類：${catLabel}（漁獲＝除燃油外全部／油＝僅燃油）｜%＝該期間較上一期間增減｜完成度以各幣別分別計算｜若當月未滿整月，會再細分週次｜點客戶列展開明細｜客戶數：${g.custCount} 家（頂部銷售額為換算TWD後總和，方便總覽；客戶列表內仍以原幣別顯示）`;
}
function renderExport(){
  renderExpSummary();
  const months = EXP.months;
  const container = document.getElementById('content-exp');
  const metric = metricExp;
  const lastIdx = months.length-1;

  function matches(text){ if (!searchExp) return true; return text.toLowerCase().includes(searchExp.toLowerCase()); }

  let customers = EXP.customers.filter(c=>{
    if (!searchExp) return true;
    if (matches(c.customer)) return true;
    return Object.values(c.categories).some(cat=>cat.products.some(p=>matches(p.product)));
  }).map(c=>{
    if (!searchExp) return c;
    if (matches(c.customer)) return c;
    const newCats = {};
    Object.keys(c.categories).forEach(k=>{
      newCats[k] = {...c.categories[k], products: c.categories[k].products.filter(p=>matches(p.product))};
    });
    return {...c, categories: newCats};
  });

  if (catFilterExp !== 'all'){
    customers = customers.filter(c=>c.categories[catFilterExp]).map(c=>{
      const block = c.categories[catFilterExp];
      return {...c, categories: {[catFilterExp]: block},
        totalQty: block.totalQty, totalQty2025: block.totalQty2025,
        totalProfit: block.totalProfit, totalProfit2025: block.totalProfit2025,
        sortAmtTWD: block.sortAmtTWD, sortAmtTWD2025: block.sortAmtTWD2025,
        rateQty: block.rateQty, rateProfit: block.rateProfit};
    });
  }

  if (metric==='qty') customers = customers.slice().sort((a,b)=>b.totalQty-a.totalQty);
  else if (metric==='profit') customers = customers.slice().sort((a,b)=>b.totalProfit-a.totalProfit);
  else customers = customers.slice().sort((a,b)=>b.sortAmtTWD-a.sortAmtTWD);

  if (customers.length === 0){ container.innerHTML = '<div class="empty">沒有符合的客戶或品項</div>'; return; }

  function combinedAmtByCcy(c, kind){
    const out = {};
    Object.values(c.categories).forEach(block=>{
      Object.entries(block[kind]||{}).forEach(([ccy,v])=>{ out[ccy] = (out[ccy]||0) + v; });
    });
    return out;
  }

  function renderCategoryBlock(catLabel, block, currencies){
    let cmpHtml;
    if (metric==='qty'){
      cmpHtml = `<div class="cmp">
        <div class="cmpcard"><div class="l">${EXP.periodLabel}</div><div class="v">${fmtQty(block.totalQty)}</div></div>
        <div class="cmpcard"><div class="l">2025年全年</div><div class="v">${fmtQty(block.totalQty2025)}</div></div>
      </div>`;
    } else if (metric==='profit'){
      cmpHtml = `<div class="cmp">
        <div class="cmpcard"><div class="l">${EXP.periodLabel}</div><div class="v">${fmtMoneyCcy(block.totalProfit,'TWD')}</div></div>
        <div class="cmpcard"><div class="l">2025年全年</div><div class="v">${fmtMoneyCcy(block.totalProfit2025,'TWD')}</div></div>
      </div>`;
    } else {
      const rowsHtml = currencies.map(ccy=>{
        const v26 = block.totalAmtByCcy[ccy]||0, v25 = block.totalAmtByCcy2025[ccy]||0;
        if (!v26 && !v25) return '';
        return `<tr><td>${ccy}</td><td>${fmtMoney(v26)}</td><td>${fmtMoney(v25)}</td></tr>`;
      }).join('');
      cmpHtml = `<div class="cmptable"><table>
        <tr><th>幣別</th><th>${EXP.periodLabel}</th><th>2025年全年</th></tr>
        ${rowsHtml}
      </table></div>`;
    }

    const rows = months.map((m,i)=>{
      let valueLineHtml, mdHtml;
      if (metric==='qty'){
        const cur = block.monthlyQty[i];
        const prev = i>0 ? block.monthlyQty[i-1] : null;
        const chg = i>0 ? pctStr(cur, prev) : {txt:'—', cls:'flat'};
        valueLineHtml = `<div class="mrightline"><div class="v">${fmtQty(cur)}</div><div class="chg ${chg.cls}">${chg.txt}</div></div>`;
      } else if (metric==='profit'){
        const cur = block.monthlyProfit[i];
        const prev = i>0 ? block.monthlyProfit[i-1] : null;
        const chg = i>0 ? pctStr(cur, prev) : {txt:'—', cls:'flat'};
        valueLineHtml = `<div class="mrightline"><div class="v">${fmtMoneyCcy(cur,'TWD')}</div><div class="chg ${chg.cls}">${chg.txt}</div></div>`;
      } else {
        valueLineHtml = currencies.filter(ccy=>block.monthlyAmtByCcy[ccy] && block.monthlyAmtByCcy[ccy][i]).map(ccy=>{
          const cur = block.monthlyAmtByCcy[ccy][i];
          const prev = i>0 ? block.monthlyAmtByCcy[ccy][i-1] : null;
          const chg = i>0 ? pctStr(cur, prev) : {txt:'—', cls:'flat'};
          return `<div class="mrightline"><div class="v">${fmtMoneyCcy(cur,ccy)}</div><div class="chg ${chg.cls}">${chg.txt}</div></div>`;
        }).join('');
        if (!valueLineHtml) valueLineHtml = `<div class="mrightline"><div class="v">0</div></div>`;
      }

      if (i===lastIdx && block.weeks && block.weeks.length){
        mdHtml = block.weeks.map(w=>{
          let wValueHtml;
          if (metric==='qty'){
            const chg = pctStr(w.qty, w.prevQty);
            wValueHtml = `<div class="mrightline"><div class="v">${fmtQty(w.qty)}</div><div class="chg ${chg.cls}">${chg.txt}</div></div>`;
          } else if (metric==='profit'){
            const chg = pctStr(w.profit, w.prevProfit);
            wValueHtml = `<div class="mrightline"><div class="v">${fmtMoneyCcy(w.profit,'TWD')}</div><div class="chg ${chg.cls}">${chg.txt}</div></div>`;
          } else {
            wValueHtml = currencies.filter(ccy=>w.amtByCcy && w.amtByCcy[ccy]).map(ccy=>{
              const chg = pctStr(w.amtByCcy[ccy], (w.prevAmtByCcy||{})[ccy]||0);
              return `<div class="mrightline"><div class="v">${fmtMoneyCcy(w.amtByCcy[ccy],ccy)}</div><div class="chg ${chg.cls}">${chg.txt}</div></div>`;
            }).join('');
            if (!wValueHtml) wValueHtml = `<div class="mrightline"><div class="v">0</div></div>`;
          }
          const wProducts = (w.products||[]).filter(p=>{
            if (metric==='qty') return p.qty;
            if (metric==='profit') return p.profit;
            return p.amtByCcy && Object.keys(p.amtByCcy).length;
          });
          const wProdHtml = wProducts.length
            ? wProducts.map(p=>{
                let pLineHtml;
                if (metric==='qty'){
                  const chg = pctStr(p.qty, p.prevQty);
                  pLineHtml = `<div class="mdrightline"><div class="mdval">${fmtQty(p.qty)}</div><div class="chg ${chg.cls}">${chg.txt}</div></div>`;
                } else if (metric==='profit'){
                  const chg = pctStr(p.profit, p.prevProfit);
                  pLineHtml = `<div class="mdrightline"><div class="mdval">${fmtMoneyCcy(p.profit,'TWD')}</div><div class="chg ${chg.cls}">${chg.txt}</div></div>`;
                } else {
                  pLineHtml = Object.keys(p.amtByCcy||{}).map(ccy=>{
                    const chg = pctStr(p.amtByCcy[ccy], (p.prevAmtByCcy||{})[ccy]||0);
                    return `<div class="mdrightline"><div class="mdval">${fmtMoneyCcy(p.amtByCcy[ccy],ccy)}</div><div class="chg ${chg.cls}">${chg.txt}</div></div>`;
                  }).join('');
                }
                return `<div class="mdrow"><div class="mdname">${p.product}</div><div class="mdright">${pLineHtml}</div></div>`;
              }).join('')
            : '<div class="mdempty">本週無出貨品項</div>';
          return `<div class="wrow" onclick="toggleMonth(this)"><div class="m"><div class="wchev"></div>${w.label}</div><div class="mright">${wValueHtml}</div></div>
            <div class="weekdetail">${wProdHtml}</div>`;
        }).join('');
      } else {
        const monthProducts = block.products.filter(p=>{
          if (metric==='qty') return p.monthlyQty[i];
          if (metric==='profit') return p.monthlyProfit[i];
          return currencies.some(ccy=>p.monthlyAmtByCcy[ccy] && p.monthlyAmtByCcy[ccy][i]);
        });
        mdHtml = monthProducts.length
          ? monthProducts.map(p=>{
              let pLineHtml;
              if (metric==='qty'){
                const pPrev = i>0 ? p.monthlyQty[i-1] : null;
                const pChg = i>0 ? pctStr(p.monthlyQty[i], pPrev) : {txt:'—', cls:'flat'};
                pLineHtml = `<div class="mdrightline"><div class="mdval">${fmtQty(p.monthlyQty[i])}</div><div class="chg ${pChg.cls}">${pChg.txt}</div></div>`;
              } else if (metric==='profit'){
                const pPrev = i>0 ? p.monthlyProfit[i-1] : null;
                const pChg = i>0 ? pctStr(p.monthlyProfit[i], pPrev) : {txt:'—', cls:'flat'};
                pLineHtml = `<div class="mdrightline"><div class="mdval">${fmtMoneyCcy(p.monthlyProfit[i],'TWD')}</div><div class="chg ${pChg.cls}">${pChg.txt}</div></div>`;
              } else {
                pLineHtml = currencies.filter(ccy=>p.monthlyAmtByCcy[ccy] && p.monthlyAmtByCcy[ccy][i]).map(ccy=>{
                  const pPrev = i>0 ? p.monthlyAmtByCcy[ccy][i-1] : null;
                  const pChg = i>0 ? pctStr(p.monthlyAmtByCcy[ccy][i], pPrev) : {txt:'—', cls:'flat'};
                  return `<div class="mdrightline"><div class="mdval">${fmtMoneyCcy(p.monthlyAmtByCcy[ccy][i],ccy)}</div><div class="chg ${pChg.cls}">${pChg.txt}</div></div>`;
                }).join('');
              }
              return `<div class="mdrow"><div class="mdname">${p.product}</div><div class="mdright">${pLineHtml}</div></div>`;
            }).join('')
          : '<div class="mdempty">本月無出貨品項</div>';
      }

      return `<div class="mrow" onclick="toggleMonth(this)"><div class="m"><div class="mchev"></div>${m}</div><div class="mright">${valueLineHtml}</div></div>
        <div class="monthdetail">${mdHtml}</div>`;
    }).join('');

    return `<div class="catsection">
      <div class="catlabel">${catLabel}</div>
      ${cmpHtml}
      <div class="custlist">${rows}</div>
    </div>`;
  }

  container.innerHTML = customers.map((c, ci)=>{
    const repTxt = (c.reps && c.reps.length) ? c.reps.join('、') : '—';
    const catNames = Object.keys(c.categories);

    let headerRight;
    if (metric==='qty'){
      const r = rateInfo(c.rateQty);
      headerRight = `<div class="amtwrap"><div class="amtline"><div class="amt">${fmtQty(c.totalQty)}</div></div><div class="rate ratepill ${r.cls}">${r.txt}</div></div>`;
    } else if (metric==='profit'){
      const r = rateInfo(c.rateProfit);
      headerRight = `<div class="amtwrap"><div class="amtline"><div class="amt">${fmtMoneyCcy(c.totalProfit,'TWD')}</div></div><div class="rate ratepill ${r.cls}">${r.txt}</div></div>`;
    } else {
      const cur = combinedAmtByCcy(c,'totalAmtByCcy');
      const prev = combinedAmtByCcy(c,'totalAmtByCcy2025');
      const lines = c.currencies.filter(ccy=>cur[ccy]).map(ccy=>{
        const r = rateInfo(rateOf(cur[ccy], prev[ccy]||0));
        return `<div class="amtline"><div class="amt">${fmtMoneyCcy(cur[ccy],ccy)}</div><div class="rate ratepill ${r.cls}" style="margin-top:0;">${r.txt}</div></div>`;
      }).join('');
      headerRight = `<div class="amtwrap">${lines}</div>`;
    }

    const catBlocksHtml = catNames.map(cat=>renderCategoryBlock(cat, c.categories[cat], c.categories[cat].currencies)).join('');

    return `
      <div class="custgroup${searchExp ? ' open':''}" data-idx="${ci}">
        <div class="custheadmain" onclick="toggleCust(this)">
          <div class="left">
            <div class="name">${c.customer}</div>
            <div class="repbadge">業務：${repTxt}</div>
          </div>
          <div class="right">
            ${headerRight}
            <div class="chev"></div>
          </div>
        </div>
        <div class="custbodywrap">
          ${catBlocksHtml}
        </div>
      </div>`;
  }).join('');
}

/* ---------- shared toggles ---------- */
function toggleCust(el){ el.parentElement.classList.toggle('open'); }
function toggleMonth(el){ el.classList.toggle('open'); }

document.getElementById('search-dom').addEventListener('input', (e)=>{ searchDom = e.target.value.trim(); renderDomestic(); });
document.getElementById('search-exp').addEventListener('input', (e)=>{ searchExp = e.target.value.trim(); renderExport(); });
document.getElementById('tabs-dom').addEventListener('click', (e)=>{
  const t = e.target.closest('.tab'); if (!t) return;
  metricDom = t.dataset.metric;
  document.querySelectorAll('#tabs-dom .tab').forEach(x=>x.classList.toggle('active', x===t));
  renderDomestic();
});
document.getElementById('tabs-exp').addEventListener('click', (e)=>{
  const t = e.target.closest('.tab'); if (!t) return;
  metricExp = t.dataset.metric;
  document.querySelectorAll('#tabs-exp .tab').forEach(x=>x.classList.toggle('active', x===t));
  renderExport();
});
document.getElementById('cattabs-exp').addEventListener('click', (e)=>{
  const t = e.target.closest('.tab'); if (!t) return;
  catFilterExp = t.dataset.cat;
  document.querySelectorAll('#cattabs-exp .tab').forEach(x=>x.classList.toggle('active', x===t));
  renderExport();
});

document.querySelector(`#tabs-dom .tab[data-metric="${metricDom}"]`).classList.add('active');
document.querySelector(`#tabs-exp .tab[data-metric="${metricExp}"]`).classList.add('active');
document.querySelector(`#cattabs-exp .tab[data-cat="${catFilterExp}"]`).classList.add('active');

renderHome();
renderDomestic();
renderExport();
gotoPage('home');
</script>
