<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>大漁-內銷出貨量比較</title>
<style>
  :root{
    --navy:#1B3A5C; --navy-2:#264A6E; --gold:#C9932E; --gold-soft:#F3E6C8;
    --bg:#F4F5F7; --card:#FFFFFF; --line:#E4E7EB; --text:#22262B; --sub:#6B7078;
    --green:#2E7D4F; --green-bg:#E5F3EA; --red:#B42E2E; --red-bg:#FBEAEA;
    --amber:#8A6D00; --amber-bg:#FFF2B2;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans CJK TC","Microsoft JhengHei",Helvetica,Arial,sans-serif;
    -webkit-tap-highlight-color:transparent;}
  .wrap{max-width:560px;margin:0 auto;padding-bottom:40px;}

  header{position:sticky;top:0;z-index:20;background:var(--navy);color:#fff;padding:14px 16px;}
  header .brand{font-size:12.5px;opacity:.75;letter-spacing:.3px;}
  header h1{font-size:18px;margin:2px 0 2px 0;font-weight:700;}
  header .period{font-size:11.5px;opacity:.75;}

  .searchbar{padding:10px 14px;background:var(--navy-2);}
  .searchbar input{width:100%;padding:9px 12px;border-radius:9px;border:none;
    font-size:14.5px;background:rgba(255,255,255,.92);color:var(--text);}
  .searchbar input::placeholder{color:#8a8f96;}

  .summary{display:flex;gap:8px;padding:12px 14px 4px 14px;}
  .sumcard{flex:1;background:var(--card);border-radius:10px;padding:10px 12px;
    box-shadow:0 1px 2px rgba(20,30,45,.06);}
  .sumcard .lbl{font-size:11px;color:var(--sub);margin-bottom:3px;}
  .sumcard .val{font-size:15px;font-weight:700;color:var(--navy);}

  .note{font-size:11px;color:var(--sub);padding:6px 16px 10px 16px;line-height:1.5;}

  .repgroup{margin:10px 12px;background:var(--card);border-radius:12px;
    box-shadow:0 1px 3px rgba(20,30,45,.07);overflow:hidden;}
  .rephead{display:flex;align-items:center;justify-content:space-between;
    padding:13px 14px;cursor:pointer;user-select:none;}
  .rephead .name{font-size:15px;font-weight:700;color:var(--navy);}
  .rephead .name .badge{display:inline-block;margin-left:7px;font-size:11px;font-weight:600;
    color:var(--sub);background:var(--bg);border-radius:20px;padding:2px 8px;}
  .rephead .right{display:flex;align-items:center;gap:8px;}
  .rephead .total{font-size:13.5px;color:var(--sub);font-variant-numeric:tabular-nums;}
  .chev{width:9px;height:9px;border-right:2px solid var(--sub);border-bottom:2px solid var(--sub);
    transform:rotate(45deg);transition:transform .18s;flex:none;}
  .repgroup.open > .rephead .chev{transform:rotate(-135deg);}

  .custlist{display:none;border-top:1px solid var(--line);}
  .repgroup.open .custlist{display:block;}

  .custrow{border-bottom:1px solid var(--line);}
  .custrow:last-child{border-bottom:none;}
  .custhead{display:flex;align-items:center;justify-content:space-between;
    padding:11px 14px 11px 18px;cursor:pointer;user-select:none;background:#FAFBFC;gap:8px;}
  .custhead .cname{font-size:13.5px;font-weight:600;color:var(--text);
    flex:1;line-height:1.35;}
  .custhead .cright{display:flex;align-items:center;gap:7px;flex:none;}
  .custhead .ctotal{font-size:12.5px;color:var(--sub);font-variant-numeric:tabular-nums;}
  .ratepill{font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:20px;white-space:nowrap;}
  .ratepill.high{background:var(--green-bg);color:var(--green);}
  .ratepill.mid{background:var(--amber-bg);color:var(--amber);}
  .ratepill.low{background:var(--red-bg);color:var(--red);}
  .ratepill.new{background:#E7ECF3;color:var(--navy-2);}

  .custbody{display:none;padding:8px 14px 14px 14px;background:#FAFBFC;}
  .custrow.open .custbody{display:block;}

  .cmp{display:flex;gap:8px;margin-bottom:8px;}
  .cmpcard{flex:1;background:#fff;border:1px solid var(--line);border-radius:8px;padding:7px 9px;}
  .cmpcard .l{font-size:10px;color:var(--sub);}
  .cmpcard .v{font-size:13px;font-weight:700;color:var(--navy);font-variant-numeric:tabular-nums;}

  .mrow{display:flex;align-items:center;padding:5px 4px;font-size:12.5px;
    border-bottom:1px dashed var(--line);cursor:pointer;user-select:none;}
  .mrow:last-child{border-bottom:none;}
  .mrow .m{width:70px;color:var(--sub);display:flex;align-items:center;gap:4px;}
  .mrow .m .mchev{width:6px;height:6px;border-right:1.6px solid var(--sub);border-bottom:1.6px solid var(--sub);
    transform:rotate(45deg);transition:transform .15s;flex:none;}
  .mrow.open .m .mchev{transform:rotate(-135deg);}
  .mrow .v{flex:1;text-align:right;font-variant-numeric:tabular-nums;color:var(--text);padding-right:8px;}
  .mrow .chg{width:56px;text-align:right;font-weight:600;font-variant-numeric:tabular-nums;}
  .chg.up{color:var(--green);}
  .chg.down{color:var(--red);}
  .chg.flat{color:var(--sub);font-weight:400;}

  .monthdetail{display:none;padding:2px 4px 8px 22px;border-bottom:1px dashed var(--line);
    background:#F1F3F5;}
  .monthdetail.open{display:block;}
  .mdrow{display:flex;justify-content:space-between;align-items:center;font-size:11.5px;padding:3px 0;color:var(--sub);}
  .mdrow .mdname{color:var(--text);max-width:52%;}
  .mdrow .mdright{display:flex;align-items:center;gap:8px;}
  .mdrow .mdval{font-variant-numeric:tabular-nums;font-weight:600;color:var(--navy-2);}
  .mdrow .mdchg{width:48px;text-align:right;font-variant-numeric:tabular-nums;font-weight:600;}
  .mdempty{font-size:11px;color:var(--sub);padding:4px 0;}

  .empty{padding:40px 20px;text-align:center;color:var(--sub);font-size:13.5px;}
  .footer{padding:16px;text-align:center;color:var(--sub);font-size:10.5px;}
</style>
</head>

let searchTerm = '';

function fmt(n){
  if (n === null || n === undefined) return '0';
  const r = Math.round(n*10)/10;
  return Number.isInteger(r) ? r.toLocaleString('en-US') : r.toLocaleString('en-US',{maximumFractionDigits:1});
}
function pctStr(cur, prev){
  if (prev === null || prev === undefined) return {txt:'—', cls:'flat'};
  if (prev === 0){
    return cur > 0 ? {txt:'+100%', cls:'up'} : {txt:'—', cls:'flat'};
  }
  const p = (cur - prev) / prev * 100;
  const cls = p > 0.05 ? 'up' : (p < -0.05 ? 'down' : 'flat');
  const sign = p >= 0 ? '+' : '';
  return {txt: sign + p.toFixed(0) + '%', cls};
}
function rateInfo(rate){
  if (typeof rate === 'string') return {txt: rate, cls:'new'};
  if (rate === null || rate === undefined) return {txt:'—', cls:'new'};
  const pct = rate*100;
  const cls = pct >= 80 ? 'high' : (pct >= 40 ? 'mid' : 'low');
  return {txt: pct.toFixed(0)+'%', cls};
}
function matches(text){
  if (!searchTerm) return true;
  return text.toLowerCase().includes(searchTerm.toLowerCase());
}

function renderSummary(reps){
  const totalQty = reps.reduce((a,r)=>a+r.total,0);
  const custCount = reps.reduce((a,r)=>a+r.customers.length,0);
  document.getElementById('summary').innerHTML = `
    <div class="sumcard"><div class="lbl">總出貨量(26年)</div><div class="val">${fmt(totalQty)}</div></div>
    <div class="sumcard"><div class="lbl">客戶數</div><div class="val">${custCount} 家</div></div>
  `;
}

function render(){
  const reps = DATA.reps;
  renderSummary(reps);
  const months = DATA.months;
  const container = document.getElementById('content');

  const filteredReps = reps.map(rep=>{
    const customers = rep.customers.filter(c=>{
      if (matches(c.customer)) return true;
      return c.products.some(p=>matches(p.product));
    });
    return {...rep, customers};
  }).filter(r=> !searchTerm || r.customers.length>0 || matches(r.rep));

  if (filteredReps.length === 0){
    container.innerHTML = '<div class="empty">沒有符合的客戶或品項</div>';
    return;
  }

  container.innerHTML = filteredReps.map((rep, ri)=>{
    const custHtml = rep.customers.map((c, ci)=>{
      const rows = months.map((m,i)=>{
        const prev = i>0 ? c.monthly[i-1] : null;
        const chg = i>0 ? pctStr(c.monthly[i], prev) : {txt:'—', cls:'flat'};
        const monthProducts = c.products.filter(p=>p.monthly[i]).sort((a,b)=>b.monthly[i]-a.monthly[i]);
        const mdHtml = monthProducts.length
          ? monthProducts.map(p=>{
              const pPrev = i>0 ? p.monthly[i-1] : null;
              const pChg = i>0 ? pctStr(p.monthly[i], pPrev) : {txt:'—', cls:'flat'};
              return `<div class="mdrow"><div class="mdname">${p.product}</div><div class="mdright"><div class="mdval">${fmt(p.monthly[i])}</div><div class="mdchg chg ${pChg.cls}">${pChg.txt}</div></div></div>`;
            }).join('')
          : '<div class="mdempty">本月無出貨品項</div>';
        return `<div class="mrow" onclick="toggleMonth(this)"><div class="m"><div class="mchev"></div>${m}</div><div class="v">${fmt(c.monthly[i])}</div><div class="chg ${chg.cls}">${chg.txt}</div></div>
          <div class="monthdetail">${mdHtml}</div>`;
      }).join('');

      const cRate = rateInfo(c.rate);

      return `
        <div class="custrow" data-idx="${ri}-${ci}">
          <div class="custhead" onclick="toggleCust(this)">
            <div class="cname">${c.customer}</div>
            <div class="cright">
              <div class="ratepill ${cRate.cls}">${cRate.txt}</div>
              <div class="ctotal">${fmt(c.total)}</div>
            </div>
          </div>
          <div class="custbody">
            <div class="cmp">
              <div class="cmpcard"><div class="l">2026年1-8月10日</div><div class="v">${fmt(c.total)}</div></div>
              <div class="cmpcard"><div class="l">2025年全年</div><div class="v">${fmt(c.total2025)}</div></div>
            </div>
            ${rows}
          </div>
        </div>`;
    }).join('');

    return `
      <div class="repgroup${searchTerm ? ' open':''}" data-idx="${ri}">
        <div class="rephead" onclick="toggleRep(this)">
          <div class="name">${rep.rep}<span class="badge">${rep.customers.length}客戶</span></div>
          <div class="right"><div class="total">${fmt(rep.total)}</div><div class="chev"></div></div>
        </div>
        <div class="custlist">${custHtml}</div>
      </div>`;
  }).join('');
}

function toggleRep(el){ el.parentElement.classList.toggle('open'); }
function toggleCust(el){ el.parentElement.classList.toggle('open'); }
function toggleMonth(el){
  el.classList.toggle('open');
  el.nextElementSibling.classList.toggle('open');
}

document.getElementById('search').addEventListener('input', (e)=>{
  searchTerm = e.target.value.trim();
  render();
});

render();
</script>
